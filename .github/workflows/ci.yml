name: PickLoop verification
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-24.04
    env:
      MUJOCO_GL: egl
      LIBGL_ALWAYS_SOFTWARE: '1'
      MESA_SHADER_CACHE_DIR: /tmp/pickloop-mesa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1-mesa-dri g++ ffmpeg
      - run: pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e '.[test]'
      - run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/ui-contract.mjs
      - run: g++ -std=c++17 -O2 -Wall -Wextra -Werror cpp/modbus_client.cpp -o /tmp/pickloop-device
      - run: python -m pickloop.cli run --seed 8 --fault suction_once --no-record --out runs/ci
      - uses: actions/upload-artifact@v4
        with:
          name: ci-raw-run
          path: runs/ci
  codespaces-lab:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run the first exercise in the Codespaces configuration
        uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: |
            python -c "import fastapi, pickloop"
            python lab.py run my-before
            python -c "import json; assert len(json.load(open('my-before/summary.json'))) == 5"
