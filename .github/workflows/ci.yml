name: PickLoop verification
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-24.04
    env:
      MUJOCO_GL: egl
      LIBGL_ALWAYS_SOFTWARE: '1'
      MESA_SHADER_CACHE_DIR: /tmp/pickloop-mesa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1-mesa-dri g++ ffmpeg tesseract-ocr tesseract-ocr-eng fonts-dejavu-core
      - run: pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e '.[test]'
      - name: Install software PLC test dependencies
        run: AWLSIM_CYTHON_BUILD=0 python -m pip install --require-hashes -r plc/requirements.txt
      - run: pytest -q
      - name: Verify the order replay and paired height records
        run: |
          python scripts/export_order_study.py --check
          python scripts/export_photo_report.py --check
          python scripts/report_photo_readouts.py --check
          python scripts/compare_transport_height.py audit --out docs/experiments/current-height
      - name: Audit the recorded software PLC trace
        run: python plc/run_interop.py --check runs/plc-interop
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/ui-contract.mjs
      - run: node --test tests/package-reader.mjs
      - run: python scripts/vendor_package_reader.py
      - run: g++ -std=c++17 -O2 -Wall -Wextra -Werror cpp/modbus_client.cpp -o /tmp/pickloop-device
      - run: python -m pickloop.cli run --seed 8 --fault suction_once --no-record --out runs/ci
      - uses: actions/upload-artifact@v4
        with:
          name: ci-raw-run
          path: runs/ci
  codespaces-lab:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run the first exercise in the Codespaces configuration
        uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: |
            python -c "import fastapi, timm, pickloop; from pickloop.grocery_catalogue import DEFAULT_HEAD; from pickloop.catalogue_model import CatalogueHead; assert len(CatalogueHead.load(DEFAULT_HEAD).names) == 81"
            pickloop recognize --help
            python lab.py run my-before
            python -c "import json; assert len(json.load(open('my-before/summary.json'))) == 5"
